<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Price &amp; Risk Simulator</title>
    <!--
      Runtime configuration: the API address, written at deploy time rather
      than at build time. Loaded before the application so changing endpoint
      needs no rebuild.

      %BASE_URL% follows the Vite base, so it works both at the root and deep
      inside a GitHub Pages sub-path.

      %BUILD_ID% changes with every build. Unlike the bundle, config.js carries
      no hash in its name, so nothing else would ever invalidate it in a
      browser cache: a visitor could pair a fresh bundle with a stale
      configuration. The token keeps the two together.
    -->
    <script src="%BASE_URL%config.js?v=%BUILD_ID%"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

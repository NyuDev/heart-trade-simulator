<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />

    <!--
      Link previews. A crawler runs no JavaScript and never receives the
      fragment, so what it reads here is all it will ever know about the page:
      these values describe the tool itself, in both languages, and stay the
      same whatever quote the visitor ends up on.

      The canonical address is filled in at build time, so it follows the
      deployment rather than being pinned to one host.
    -->
    <title>Price &amp; Risk Simulator · Simulateur de Prix &amp; de Risques</title>
    <meta
      name="description"
      content="Work out how many hearts to ask for a Sky trade paid in real money. Calcule combien de cœurs demander pour un échange Sky payé en argent réel."
    />
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="icon" href="%BASE_URL%logo.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#38bdf8" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heart Trade Simulator" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:title" content="Price &amp; Risk Simulator · Simulateur de Prix &amp; de Risques" />
    <meta
      property="og:description"
      content="Work out how many hearts to ask for a Sky trade paid in real money.&#10;Calcule combien de cœurs demander pour un échange Sky payé en argent réel."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary" />
    <!--
      Runtime configuration: the API address, written at deploy time rather
      than at build time. Loaded before the application so changing endpoint
      needs no rebuild.

      %BASE_URL% follows the Vite base, so it works both at the root and deep
      inside a GitHub Pages sub-path.

      %BUILD_ID% changes with every build. Unlike the bundle, config.js carries
      no hash in its name, so nothing else would ever invalidate it in a
      browser cache: a visitor could pair a fresh bundle with a stale
      configuration. The token keeps the two together.
    -->
    <script src="%BASE_URL%config.js?v=%BUILD_ID%"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <!--
      Cloudflare Web Analytics. Cookieless: no identifier is stored on the
      visitor's device and nothing follows them across sites. The domain is
      DNS-only on Cloudflare, so traffic never passes through it and this
      beacon is the only way it sees a visit at all.
    -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "8b2b77e090604588b3afc5e9e71dd82e"}'
    ></script>
  </body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Minimum permissions required by the official Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; the one in flight is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Serves the site from /<repository>/ on github.io.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Write runtime config
        env:
          # Repository variable (Settings > Secrets and variables > Actions >
          # Variables). Empty until the API is online, in which case the
          # interface reports that no API is connected, which is expected.
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e '
            const fs = require("fs");
            const url = process.env.API_BASE_URL || "/api";
            fs.writeFileSync(
              "dist/config.js",
              `window.__SIMULATEUR_CONFIG__ = { apiBaseUrl: ${JSON.stringify(url)} };\n`
            );
            console.log("apiBaseUrl =", url);
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
